        document.addEventListener('pointerdown', function (e) {
          if (!presenting || !(e.pointerType === 'touch' || e.pointerType === 'pen')) return
          if (e.clientY < rect().bottom - BAR_BAND) return
          var shown = document.body.classList.contains('bar-shown')
          showBar(4000)                       // also keeps it up while it is being used
          if (e.pointerType === 'pen' && !shown) { e.stopPropagation(); e.preventDefault() }
        }, true)
        root.addEventListener('mouseleave', function () { if (presenting) laterHideBar() })
        syncPresenting()

        /* --- contents ------------------------------------------------------
           Opened with no ?deck, the player lists the decks instead of showing
           an error. The list comes from decks/index.json (written by
           scripts/make_deck_index.py) because a static host — which is what
           this is, deployed — cannot list a directory.

           Every link inherits the flags THIS page was opened with, so
           class.html?student is one bookmark that leads only to student views,
           and ?notes likewise. That is also why the links are built from the
           current params rather than hard-coded. */
        function showContents() {
          document.body.classList.add('contents')
          var el = document.getElementById('contents')
          document.title = COURSE.label + 'Class decks'

          var carry = []
          if (studentView) carry.push('student')
          if (params.has('notes')) carry.push('notes')
          var suffix = carry.length ? '&' + carry.join('&') : ''

          fetch('decks/index.json', FETCH_OPTS)
            .then(function (r) { if (!r.ok) throw new Error('no decks/index.json (' + r.status + ')'); return r.json() })
            .then(function (index) {
              if (index.studentBuild) { studentBuild = true; studentView = true }
              var parts = ['<h1>' + COURSE.label + 'Class decks</h1>']
              // One audience switch for the whole page, rather than a link per
              // row: thirteen of those fragmented the list and made the decks
              // themselves harder to scan, which is the one thing this page is
              // for. Switching re-renders every link below.
              // On a studentBuild there is no other audience to switch TO, and
              // saying so would tell a public reader that a hidden instructor
              // version exists. So the whole line goes.
              if (!studentBuild) {
                parts.push('<p class="lede">' +
                  (studentView
                    ? 'Student view — instructor-only slides are dropped.'
                    : 'Instructor view — every slide, including instructor-only ones.') +
                  // Keep ?notes across the switch: losing it silently would look
                  // like the notes flag had stopped working.
                  ' <a class="swap" href="class.html' +
                  (studentView
                    ? (params.has('notes') ? '?notes' : '')
                    : '?student' + (params.has('notes') ? '&notes' : '')) + '">' +
                  (studentView ? 'Switch to instructor view' : 'Switch to student view') +
                  '</a></p>')
              }
              parts.push('<ol>')
              index.decks.forEach(function (d) {
                var href = 'class.html?deck=' + encodeURIComponent(d.id) + suffix
                parts.push('<li class="' + d.kind + '">')
                parts.push('<a class="deck" href="' + href + '">')
                if (d.label) parts.push('<span class="day">' + esc(d.label) + '</span>')
                parts.push('<span class="name">' + esc(d.name) + '</span>')
                if (d.kind === 'video') parts.push('<span class="badge">video</span>')
                parts.push('<span class="count">' + d.slides + ' slides</span>')
                parts.push('</a></li>')
              })
              parts.push('</ol>')
              parts.push('<p class="foot">' + (studentView
                ? 'Arrow keys or space to move through a deck.'
                : 'Arrow keys or space to move; <b>L</b> laser, <b>D</b> draw with the mouse, ' +
                  '<b>E</b> erase. Add <code>&amp;notes</code> to any deck for presenter notes.') +
                '</p>')
              el.innerHTML = parts.join('')
            })
            .catch(function (e) {
              // The fix differs by where this is running, and the wrong advice
              // wastes real time: locally the index just needs generating,
              // deployed it needs to be built and shipped.
              el.innerHTML = '<h1>' + COURSE.label + 'Class decks</h1><p class="lede">' +
                'Could not load the deck list (' + esc(e.message) + '). ' +
                (LOCAL
                  ? 'Generate it with <code>python3 scripts/make_deck_index.py</code>, ' +
                    'or open a deck directly with <code>?deck=day1</code>.'
                  : 'This site may predate the contents page — it appears after the ' +
                    'next deploy. A deck still opens directly with <code>?deck=day1</code>.') +
                '</p>'
            })
        }

        if (!deckId) { showContents(); return }
        fetch('decks/' + encodeURIComponent(deckId) + '.json', FETCH_OPTS)
          .then(function (r) { if (!r.ok) throw new Error('no deck "' + deckId + '" (' + r.status + ')'); return r.json() })
          .then(function (d) {
            deck = d
            // Before any use of studentView below: a build whose instructor
            // slides were stripped at build time is student-only whatever the
            // URL says, so the badge, the notes and the title suffix all go.
            if (deck.studentBuild) {
              studentBuild = true; studentView = true
              // ?notes is inert here: there are no notes in a student build,
              // and the notes-on layout should not be left switched on either.
              notesOn = false; document.body.classList.remove('notes-on')
            }
            if (!deck.slides || !deck.slides.length) throw new Error('deck has no slides')
            // Annotation keys by the slide's position in the FULL deck,
            // assigned before the student filter below — see inkKey().
            deck.slides.forEach(function (s, i) { s._ink = i + 1 })
            allSlides = deck.slides.slice()
            // Student view drops instructor-only slides. NOTE: this hides them
            // from the VIEW only — the content still lives in the built book page
            // source. A truly solutions-free student build must strip them at
            // build time; do that before publishing a deck to students.
            // Private slides (instructor="private") are never in the sequence,
            // unless review mode (P, or ?private) is on, and never for students.
            reviewPrivate = params.has('private') && !studentView
            document.body.classList.toggle('review-private', reviewPrivate)
            deck.slides = visibleSlides()
            if (!deck.slides.length) throw new Error('this deck has no student slides')
            // "(student)" distinguishes the two views while both exist. On a
            // studentBuild only one does, so the suffix is just noise in a
            // student's tab and their bookmarks.
            document.title = COURSE.label + (deck.title || deckId) +
              (studentView && !studentBuild ? ' (student)' : '')
            if (!location.hash) location.hash = '1'
            render()
            if (studentView) offerPdf()
          })
          .catch(function (e) { fail('Could not load this deck. ' + e.message) })

        /* --- ⤓ PDF: the deck as a note-taking handout ------------------------
           scripts/deploy.sh prints every deck from the very tree it publishes
           and puts the PDFs at <site>/slides/pdf/<deck>.pdf, beside a manifest
           naming them. The button appears only when the manifest lists THIS
           deck, so it never offers a file that is not there: not in the
           instructor view, not in ./preview-slides.sh (no PDFs are built), and
           not on a site deployed without them (build.sh clears them, so a
           stale handout is never offered either). One fetch, and a 404 is the
           ordinary local answer.

           A link rather than a button, so "Save link as" works too. It leaves
           full screen first, as everything that hands a file to another
           window does: a full-screen window sits on its own macOS desktop and
           the download would land out of sight. No letter key: a stray press
           should not start a download. */
        var pdfBtn = document.getElementById('pdf-btn')
        var PDF_DIR = '../slides/pdf/'
        function offerPdf() {
          fetch(PDF_DIR + 'manifest.json', FETCH_OPTS)
            .then(function (r) { return r.ok ? r.json() : null })
            .then(function (m) {
              var entry = m && m.decks && m.decks[deckId]
              if (!entry || !entry.file) return
              pdfBtn.href = PDF_DIR + encodeURIComponent(entry.file)
              pdfBtn.setAttribute('download', COURSE.pdfPrefix + entry.file)
              var mb = entry.bytes ? (entry.bytes / 1048576).toFixed(1) + ' MB' : ''
              pdfBtn.title = 'Download this deck as a PDF to take notes on' +
                (entry.pages || mb ? ' (' + [entry.pages ? entry.pages + ' pages' : '', mb].filter(Boolean).join(', ') + ')' : '')
              pdfBtn.classList.add('available')
              pdfEntry = entry
              refreshNotesBtn()
            })
            .catch(function () {})
        }
        pdfBtn.addEventListener('click', function () { leaveFullscreen() })

        /* --- PDF with the viewer's own pen marks ---------------------------
           The plain PDF button above is untouched. This second one builds the
           same PDF with the marks from THIS browser's localStorage drawn onto
           its pages, in the page, with pdf-lib (vendor/pdf-lib.min.js, loaded
           only when the button is used). Nothing is uploaded: the marks never
           leave the device, which is also why the button only appears once
           there are marks to put on.

           Page i of the PDF is slide i of the deck as this player shows it.
           That holds for the student PDF and the student view, the only ones
           the site publishes; the instructor deck has no PDF. Marks are stored
           normalized (0..1 of the slide's width and height, pen width as a
           fraction of its height), and the PDF page is the same 16:9 box, so
           they map straight across; only y is flipped for PDF space. */
        var notesBtn = document.getElementById('pdf-notes-btn')
        var pdfEntry = null
        function deckHasInk() {
          if (!deck || !deck.slides) return false
          for (var i = 1; i <= deck.slides.length; i++) { if (loadInk(i).length) return true }
          return false
        }
        function refreshNotesBtn() {
          notesBtn.classList.toggle('available', !!pdfEntry && deckHasInk())
        }
        var baseUpdateNote = updateNote
        updateNote = function () { baseUpdateNote(); refreshNotesBtn() }
        function loadScript(src) {
          return new Promise(function (ok, no) {
            var el = document.createElement('script')
            el.src = src; el.onload = ok; el.onerror = function () { no(new Error('could not load ' + src)) }
            document.head.appendChild(el)
          })
        }
        var colorProbe = null
        function rgbOf(css) {              // any CSS colour -> [r,g,b] 0..1
          if (!colorProbe) colorProbe = document.createElement('canvas').getContext('2d')
          colorProbe.fillStyle = '#000'; colorProbe.fillStyle = css || '#000'
          var m = colorProbe.fillStyle
          if (m.charAt(0) === '#') return [1, 3, 5].map(function (i) { return parseInt(m.substr(i, 2), 16) / 255 })
          var n = (m.match(/[\d.]+/g) || [0, 0, 0]).map(Number)
          return [n[0] / 255, n[1] / 255, n[2] / 255]
        }
        function notesPdf() {
          var L
          var label = notesBtn.textContent
          notesBtn.textContent = 'Building…'
          return loadScript('vendor/pdf-lib.min.js')
            .then(function () { L = window.PDFLib; return fetch(PDF_DIR + encodeURIComponent(pdfEntry.file), FETCH_OPTS) })
            .then(function (r) { if (!r.ok) throw new Error('PDF ' + r.status); return r.arrayBuffer() })
            .then(function (buf) { return L.PDFDocument.load(buf) })
            .then(function (doc) {
              var pages = doc.getPages()
              for (var n = 1; n <= deck.slides.length && n <= pages.length; n++) {
                var list = loadInk(n)
                var pg = pages[n - 1], W = pg.getWidth(), H = pg.getHeight()
                list.forEach(function (st) {
                  var c = rgbOf(st.color || PEN_COLOR), col = L.rgb(c[0], c[1], c[2])
                  var w = Math.max(st.w * H, 0.5)
                  if (st.pts.length < 2) {
                    pg.drawCircle({ x: st.pts[0][0] * W, y: H - st.pts[0][1] * H, size: w / 2, color: col })
                    return
                  }
                  var d = 'M ' + (st.pts[0][0] * W).toFixed(2) + ' ' + (st.pts[0][1] * H).toFixed(2)
                  for (var i = 1; i < st.pts.length; i++) d += ' L ' + (st.pts[i][0] * W).toFixed(2) + ' ' + (st.pts[i][1] * H).toFixed(2)
                  pg.drawSvgPath(d, { x: 0, y: H, borderColor: col, borderWidth: w,
                                      borderLineCap: L.LineCapStyle.Round })
                })
              }
              return doc.save()
            })
            .then(function (bytes) {
              var url = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }))
              var a = document.createElement('a')
              a.href = url
              a.download = COURSE.pdfPrefix + pdfEntry.file.replace(/\.pdf$/, '') + '-notes.pdf'
              document.body.appendChild(a); a.click(); a.remove()
              setTimeout(function () { URL.revokeObjectURL(url) }, 60000)
            })
            .catch(function (e) { window.alert('Could not add your notes to the PDF: ' + e.message) })
            .then(function () { notesBtn.textContent = label })
        }
        notesBtn.addEventListener('click', function (e) { e.preventDefault(); leaveFullscreen(); notesPdf() })

        /* --- authoring: alt-click a slide to reach its source --------------
           Ported from the ENGS 20 deck player, but the mechanism had to change.
           There, a 'ref' slide is an IFRAME of the book page, so ptx-edit.js
           loads inside it and handles the book half for free. Here the player
           EXTRACTS and clones the markup inline (renderRef above), so there is
           no frame for ptx-edit.js to live in — which is why renderRef stamps
           data-edit-origin onto the nodes as it clones them, and why this layer
           reads that stamp to decide where a write would land:

             glue slide          -> the deck's JSON entry
             <slide> block text  -> source/*.ptx, via the same /locate + /patch
                                    the book uses, scoped to the slide's xml:id
             direct book ref     -> REFUSED for editing (it would change the
                                    reading too); Alt-click still opens it

           Local-only and self-effacing, exactly like the book's version: it
           wires nothing up unless the edit-server (127.0.0.1:8927, started by
           ./preview-slides.sh) actually answers, so it never appears for a
           student, on the deployed deck, or in a plain non-authoring preview. */
        ;(function () {
          if (!/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) return
          var EDIT_SERVER = 'http://127.0.0.1:' + (COURSE.editPort || 8927)

          // Blocks holding prose worth editing. A click bubbles up until it
          // reaches one. .slide-caption and .deck-slide-note are divs of bare
          // text (the XSL emits no <p> inside them), so they are listed in
          // their own right rather than being found via a paragraph.
          var BLOCKS = '.slide-caption, .deck-slide-note, .para, li, p, figcaption, td, th'

          var editing = null

          function toast (message, kind) {
            var existing = document.getElementById('deck-edit-toast')
            if (existing) existing.remove()
            var node = document.createElement('div')
            node.id = 'deck-edit-toast'
            node.className = 'deck-edit-toast deck-edit-toast-' + (kind || 'info')
            node.textContent = message
            document.body.appendChild(node)
            setTimeout(function () { if (node.parentNode) node.remove() },
                       kind === 'error' ? 6000 : 2800)
          }

          function describe (error) {
            return (error instanceof TypeError)
              ? 'Edit server not running — start it with ./preview-slides.sh'
              : error.message
          }
          function asJson (response) {
            return response.json().then(function (body) {
              if (!response.ok) throw new Error(body.error || 'request failed')
              return body
            })
          }

          function currentSlide () {
            return deck && deck.slides ? deck.slides[currentIndex() - 1] : null
          }
          // The slide's index in the deck FILE. Assigned before the ?student
          // filter drops instructor-only slides, so it stays correct in either
          // view — the runtime index does not.
          function jsonIndex (slide) { return slide._ink }

          function textFor (block) {
            return (block.innerText || block.textContent || '').replace(/\s+/g, ' ').trim()
          }

          // --- Alt-click: open the right source ---------------------------
          /* Everything that hands a file to the editor leaves full screen
             first. A full-screen window sits on its own macOS desktop, and
             the editor opens on another, so the deck otherwise vanishes
             behind it: ⌘Tab returns to the browser's most recent window, not
             that one. Only full screen entered with F can be left from here;
             the browser's own (⌃⌘F) cannot be left by a page. */
          function openDeckEntry (slide) {
            leaveFullscreen()
            fetch(EDIT_SERVER + '/open-deck?deck=' + encodeURIComponent(deckId) +
                  '&slide=' + jsonIndex(slide))
              .then(asJson)
              .then(function (b) { toast('Opened ' + b.file + ':' + b.line, 'ok') })
              .catch(function (e) { toast(describe(e), 'error') })
          }
          function openSlideBlock (xmlId, what) {
            leaveFullscreen()
            fetch(EDIT_SERVER + '/open-slide?id=' + encodeURIComponent(xmlId))
              .then(asJson)
              .then(function (b) { toast('Opened ' + (what || b.tag) + ' — ' + b.file + ':' + b.line, 'ok') })
              .catch(function (e) { toast(describe(e), 'error') })
          }

          /* Open the source of book content shown on a slide, as precisely as
             the click allows: the exact paragraph or task if one was clicked
             (/locate matches its text), otherwise the whole element by id. The
             fallback matters for a figure or a table, where the click may land
             on something with no prose to match on. */
          function openBookSource (block, bookId, slide) {
            var text = block ? textFor(block) : ''
            if (!text) { openSlideBlock(bookId, 'book content'); return }
            leaveFullscreen()
            fetch(EDIT_SERVER + '/locate?open=1' +
                  '&text=' + encodeURIComponent(text) +
                  '&id=' + encodeURIComponent(bookId))
              .then(function (r) { if (!r.ok) throw new Error('no match'); return r.json() })
              .then(function (b) { toast('Opened ' + b.file + ':' + b.line, 'ok') })
              .catch(function () { openSlideBlock(bookId, 'book content') })
          }

          function openSource (target, slide) {
            var titleBlock = refEl.getAttribute('data-title-from-block')
            if (slide.type === 'ref' && titleBlock && target.closest('.deck-title')) {
              return openSlideBlock(titleBlock, 'slide block')
            }
            // A ref slide's TITLE is deck glue, not book content: it is the
            // one bit of a ref slide written in the JSON.
            if (slide.type !== 'ref' || target.closest('.deck-title')) {
              return openDeckEntry(slide)
            }
            var origin = target.closest('[data-edit-origin]')
            var kind = origin && origin.getAttribute('data-edit-origin')
            if (kind === 'book' || kind === 'book-direct') {
              // Opening is always safe — it only points an editor at a file.
              return openSlideBlock(origin.getAttribute('data-edit-id'), 'book content')
            }
            openSlideBlock(slide.slide, 'slide block')
          }

          /* --- Alt-shift-click: edit in place -----------------------------
             Ask the server whether this block can be rewritten BEFORE opening
             it, so nobody is invited to type into text that could never be
             saved (a slide holding math, an <xref>, or a <sim>). Same check
             the book editing uses — see edit_status in scripts/edit-server.py. */
          function requestEdit (block, hintId) {
            if (editing) return
            editing = block   // claim it now, so a second click can't race
            var url = EDIT_SERVER + '/locate' +
              '?text=' + encodeURIComponent(textFor(block)) +
              '&id=' + encodeURIComponent(hintId)
            fetch(url).then(asJson)
              .then(function (b) {
                if (b.editable) { beginEdit(block, hintId); return }
                editing = null
                toast('Can’t edit here — ' + b.blocked + '. Opening ' +
                      b.file + ':' + b.line + ' in your editor.', 'info')
                leaveFullscreen()
                fetch(url + '&open=1').catch(function () {})
              })
              .catch(function (e) { editing = null; toast(describe(e), 'error') })
          }

          // Hand back text a failed save would otherwise discard. The clipboard
          // needs permission and can refuse, so the console is the fallback
          // that always works; the caller is told which happened.
          function keepText (text, done) {
            console.log('[deck] unsaved text:\n' + text)
            try {
              navigator.clipboard.writeText(text)
                .then(function () { done(true) })
                .catch(function () { done(false) })
            } catch (e) { done(false) }
          }

          // The words of a card or a slide title are attributes of its <slide>
          // block, edited through /patch-attr. textContent, not innerText: the
          // title is shown in capitals by CSS and innerText would report that.
          function plainText (block) { return (block.textContent || '').replace(/\s+/g, ' ').trim() }
          function requestAttrEdit (block, id, attr) {
            if (editing) return
            editing = block
            beginEdit(block, id, attr)
          }

          function beginEdit (block, hintId, attr) {
            var read = attr ? plainText : textFor
            var original = read(block)
            var originalHTML = block.innerHTML
            // Captured now: the save resolves later, by which time the author
            // may have paged on to a slide from a different book page.
            var fromPage = (currentSlide() || {}).page
            editing = block
            block.classList.add('deck-edit-active')
            block.setAttribute('contenteditable', 'plaintext-only')
            // Nothing opened here contains inline markup — the server refuses
            // those up front and sends you to the file. An earlier version
            // opened them with the <clr>/<c> spans set contenteditable=false,
            // but retyping a selection deletes those spans outright, so the
            // guard failed exactly when a whole bullet had been reworded.
            block.focus()

            function finish (save) {
              if (editing !== block) return
              editing = null
              block.removeAttribute('contenteditable')
              block.classList.remove('deck-edit-active')
              block.removeEventListener('keydown', onKey)
              block.removeEventListener('blur', onBlur)

              var updated = read(block)
              if (!save || updated === original) { block.innerHTML = originalHTML; return }
              fetch(EDIT_SERVER + (attr ? '/patch-attr' : '/patch'), {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(attr
                  ? { text: original, newText: updated, id: hintId, attr: attr }
                  : { text: original, newText: updated, id: hintId })
              })
                .then(asJson)
                .then(function (b) {
                  // The built page this slide was extracted from is now stale.
                  // Drop it so navigating back re-reads the rebuilt copy
                  // instead of silently showing the pre-edit text again.
                  delete pageCache[fromPage]
                  toast('Saved to ' + b.file + ':' + b.line, 'ok')
                })
                .catch(function (error) {
                  // The source is the truth, so the slide must go back. The
                  // wording someone just spent minutes on is not the source's
                  // to throw away though: copy it out BEFORE reverting, and
                  // open the file, so the work survives as a paste.
                  keepText(updated, function (kept) {
                    block.innerHTML = originalHTML
                    toast(describe(error) +
                          (kept ? ' Your text is on the clipboard.' : ' Your text is in the console.') +
                          ' Opening the file.', 'error')
                    leaveFullscreen()
                    fetch(EDIT_SERVER + '/locate?open=1' +
                          '&text=' + encodeURIComponent(original) +
                          '&id=' + encodeURIComponent(hintId)).catch(function () {})
                  })
                })
            }
            function onKey (event) {
              if (event.key === 'Escape') { event.preventDefault(); event.stopPropagation(); finish(false) }
              else if (event.key === 'Enter' && (event.metaKey || event.ctrlKey)) {
                event.preventDefault(); event.stopPropagation(); finish(true)
              } else if (event.key === 'Enter') {
                event.preventDefault()   // one block is one paragraph
              } else {
                event.stopPropagation()  // don't let typing drive the deck
              }
            }
            function onBlur () { finish(true) }
            block.addEventListener('keydown', onKey)
            block.addEventListener('blur', onBlur)
            toast('Editing — click out or ⌘⏎ saves, esc cancels', 'info')
          }
          function editHere (target, slide) {
            // A title written on its <slide title="…"> block: edit it in place.
            var titleBlock = refEl.getAttribute('data-title-from-block')
            var titleEl2 = slide.type === 'ref' && titleBlock && target.closest('.deck-title')
            if (titleEl2) return requestAttrEdit(titleEl2, titleBlock, 'title')
            // A card whose words are a <slide kind="…"> in the book: its title,
            // kicker and subtitle are attributes, its bullets and body text are
            // the block's own text. Both edit in place.
            var fromBlock = glueEl.contains(target) && glueEl.getAttribute('data-from-block')
            if (fromBlock) {
              var field = target.closest('.title-main, .section-main, #glue > h2')
              if (field) return requestAttrEdit(field, fromBlock, 'title')
              field = target.closest('.sub')
              if (field) return requestAttrEdit(field, fromBlock, 'subtitle')
              field = target.closest('.section-kicker')
              if (field) return requestAttrEdit(field, fromBlock, 'kicker')
              field = target.closest('#glue li, #glue p.big')
              if (field) return requestEdit(field, fromBlock)
              toast('Nothing editable there. Alt-shift-click the title, a bullet or the text.', 'info')
              return
            }
            if (slide.type !== 'ref' || target.closest('.deck-title')) {
              return openSlideForm(slide)
            }
            var origin = target.closest('[data-edit-origin]')
            var kind = origin && origin.getAttribute('data-edit-origin')
            if (kind === 'book' || kind === 'book-direct') {
              /* Book content behind a direct ref: not editable from here, for
                 the same reason as everything else this refuses — it would
                 change the reading, not just the slide.

                 It OPENS the file rather than telling you to go and Alt-click
                 it yourself. Being refused and being handed the file are the
                 same moment, and the pre-flight path below has always done it
                 that way; leaving this one branch to only talk made the tool
                 look like it behaved differently on different slides. */
              var refused = target.closest(BLOCKS)
              toast('Book content (' + origin.getAttribute('data-edit-id') +
                    ') — editing it here would change the reading too. ' +
                    'Opening it in your editor.', 'info')
              openBookSource(refused, origin.getAttribute('data-edit-id'), slide)
              return
            }
            var block = target.closest(BLOCKS)
            if (!block || !refEl.contains(block)) {
              toast('Nothing editable there. Alt-shift-click a bullet, a caption, ' +
                    'or the title bar.', 'info')
              return
            }
            requestEdit(block, origin ? origin.getAttribute('data-edit-id') : slide.slide)
          }

          // --- the glue form (alt-shift-click a glue slide) ----------------
          // Display order per type; [key, label, kind] where kind is how the
          // field reads and writes: text = one line, area = multi-line string,
          // lines = textarea <-> array of strings.
          var NOTE_FIELD = ['presenterNote', 'Presenter note (never projected)', 'area']
          var BULLETS = ['items', 'Bullets (one per line)', 'lines']
          var FORM = {
            title:   [['title', 'Title', 'text'], ['subtitle', 'Subtitle', 'text'], NOTE_FIELD],
            section: [['kicker', 'Kicker (e.g. "Part 1")', 'text'], ['title', 'Title', 'text'], NOTE_FIELD],
            agenda:  [['title', 'Title', 'text'], BULLETS, NOTE_FIELD],
            recap:   [['title', 'Title', 'text'], BULLETS, NOTE_FIELD],
            notice:  [['title', 'Title', 'text'], BULLETS, NOTE_FIELD],
            prompt:  [['title', 'Title', 'text'], ['body', 'Body', 'area'],
                      ['note', 'Note (shown on the slide)', 'area'], NOTE_FIELD],
            // A ref slide's own JSON fields. Its CONTENT lives in the book and
            // is edited in place, so it is deliberately not offered here.
            ref:     [['title', 'Slide title (deck JSON)', 'text'], NOTE_FIELD]
          }
          var slideeditEl = document.getElementById('slideedit')
          var seFields = document.getElementById('se-fields')
          var seType = document.getElementById('se-type')
          var seStatusEl = document.getElementById('se-status')
          var curForm = null

          function seStatus (message, kind) {
            seStatusEl.textContent = message || ''
            seStatusEl.className = kind || ''
          }
          function splitLines (v) {
            return v.split('\n').map(function (s) { return s.trim() })
                    .filter(function (s) { return s.length })
          }

          function openSlideForm (slide) {
            var spec = FORM[slide.type]
            if (!spec) { toast('This slide type has no form.', 'info'); return }
            /* Populate from the FILE, not from the deck this page loaded. They
               diverge the moment a deck is hand-edited in the editor — the
               player only reads a deck once, at page load — and a form filled
               from the stale copy would quietly write those old values back
               over the newer file when saved. The fingerprint that comes with
               it is checked on save, so even a change made while the form is
               open is caught rather than overwritten. */
            fetch(EDIT_SERVER + '/deck-slide?deck=' + encodeURIComponent(deckId) +
                  '&slide=' + jsonIndex(slide))
              .then(asJson)
              .then(function (b) { fillSlideForm(slide, spec, b.slide, b.fingerprint) })
              .catch(function (e) { toast(describe(e), 'error') })
          }

          function fillSlideForm (slide, spec, current, fingerprint) {
            curForm = { type: slide.type, src: slide, fingerprint: fingerprint }
            seType.textContent = slide.type
            seFields.innerHTML = ''
            // If the file disagrees with what is on screen, say so before any
            // typing happens — the slide behind the form is the old one.
            var drifted = spec.some(function (field) {
              return JSON.stringify(current[field[0]] == null ? '' : current[field[0]]) !==
                     JSON.stringify(slide[field[0]] == null ? '' : slide[field[0]])
            })
            if (drifted) {
              toast('This deck changed on disk since the page loaded — the form ' +
                    'shows the current file, which is not what the slide behind ' +
                    'it shows. Reload to bring them back together.', 'info')
            }
            spec.forEach(function (field) {
              var key = field[0], value = current[key], kind = field[2]
              var wrap = document.createElement('div')
              wrap.className = 'se-field'
              var label = document.createElement('label')
              label.textContent = field[1]
              wrap.appendChild(label)
              var input = document.createElement(kind === 'text' ? 'input' : 'textarea')
              if (kind === 'text') input.type = 'text'
              input.dataset.key = key
              input.dataset.kind = kind
              // Setting .value (never innerHTML) keeps any markup in the string
              // as literal text, so a bullet's <c>…</c> round-trips untouched.
              input.value = (kind === 'lines')
                ? [].concat(value == null ? [] : value).join('\n')
                : (value == null ? '' : String(value))
              wrap.appendChild(input)
              seFields.appendChild(wrap)
            })
            seStatus('')
            ink.classList.remove('armed')   // keep the canvas off the form
            slideeditEl.classList.add('on')
            var first = seFields.querySelector('input, textarea')
            if (first) first.focus()
          }

          function readSlideForm () {
            var fields = {}
            ;[].forEach.call(seFields.querySelectorAll('[data-key]'), function (el) {
              var key = el.dataset.key
              if (el.dataset.kind !== 'lines') { fields[key] = el.value; return }
              // Keep the value's original shape: items is always a list.
              var arr = splitLines(el.value)
              var wasArray = key === 'items' || Array.isArray(curForm.src[key])
              fields[key] = (wasArray || arr.length > 1) ? arr : (arr[0] || '')
            })
            return fields
          }

          function saveSlideForm () {
            if (!curForm) return
            var fields = readSlideForm()
            seStatus('Saving…')
            fetch(EDIT_SERVER + '/patch-deck', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                deck: deckId,
                slide: jsonIndex(curForm.src),
                // Both are refusals-not-overwrites: `type` catches this
                // position becoming a different KIND of slide, `fingerprint`
                // catches any edit to it since the form was opened.
                type: curForm.type,
                fingerprint: curForm.fingerprint,
                fields: fields
              })
            })
              .then(asJson)
              .then(function (b) {
                // Mirror into the in-memory deck so the slide shows the edit
                // at once, without waiting on a rebuild.
                Object.keys(fields).forEach(function (k) {
                  var v = fields[k]
                  if (v === '' || v === null || (Array.isArray(v) && !v.length)) delete curForm.src[k]
                  else curForm.src[k] = v
                })
                seStatus('Saved to ' + b.file + ':' + b.line, 'ok')
                render()
                setTimeout(closeSlideForm, 700)
              })
              .catch(function (e) {
                // The form stays open with the typing intact — this is the
                // recoverable case, and closing it would throw away the very
                // words the refusal was protecting.
                seStatus(describe(e), 'err')
              })
          }

          function closeSlideForm () {
            slideeditEl.classList.remove('on')
            curForm = null
            syncInk()
          }
          document.getElementById('se-save').addEventListener('click', saveSlideForm)
          document.getElementById('se-cancel').addEventListener('click', closeSlideForm)

          /* Probe first: only wire up the affordance once the edit-server has
             answered, so nothing shows when authoring isn't actually running (a
             plain in-browser preview on localhost, say). A bare GET is a simple
             cross-origin request — no CORS preflight — and the 404 it returns
             still RESOLVES the promise; only a real network error (nothing
             listening at all) rejects and leaves us inert. */
          fetch(EDIT_SERVER + '/open-slide').then(function () {
            document.addEventListener('keydown', function (e) {
              if (e.key === 'Alt') document.body.classList.add('deck-edit-armed')
            })
            document.addEventListener('keyup', function (e) {
              if (e.key === 'Alt') document.body.classList.remove('deck-edit-armed')
            })
            window.addEventListener('blur', function () {
              document.body.classList.remove('deck-edit-armed')
            })

            /* A coding window on a demo slide (<cmecode> in a <slide>) is an iframe: its
               clicks never reach this page. So while Alt is held, each one gets a
               transparent overlay this page CAN see clicks on; Alt-click opens that
               starting point in the starting-points tool. Only for a course that
               names the tool: COURSE.startPoints = 'http://127.0.0.1:5050'. The
               starting point's name is in the iframe's own address, ?src=…/NAME.c. */
            if (COURSE.startPoints) {
              var spOverlays = []
              var clearSpOverlays = function () {
                spOverlays.forEach(function (o) { if (o.parentNode) o.parentNode.removeChild(o) })
                spOverlays = []
              }
              document.addEventListener('keydown', function (e) {
                if (e.key !== 'Alt' || spOverlays.length) return
                ;[].forEach.call(document.querySelectorAll('#ref iframe'), function (f) {
                  var m = /[?&]src=[^&]*?([^/&]+)\.c(?:&|$)/.exec(f.getAttribute('src') || '')
                  if (!m) return
                  var name = decodeURIComponent(m[1]), r = f.getBoundingClientRect()
                  var o = document.createElement('div')
                  o.setAttribute('data-sp-overlay', '1')
                  o.title = 'Alt-click: edit "' + name + '" in the starting points tool'
                  o.style.cssText = 'position:fixed;z-index:50;cursor:pointer;border-radius:4px;' +
                    'outline:2px solid rgba(43,138,62,.55);outline-offset:-2px;background:rgba(43,138,62,.06);' +
                    'left:' + r.left + 'px;top:' + r.top + 'px;width:' + r.width + 'px;height:' + r.height + 'px'
                  o.addEventListener('click', function (ev) {
                    ev.preventDefault(); ev.stopPropagation()
                    window.open(COURSE.startPoints + '/?file=' + encodeURIComponent(name), '_blank')
                  })
                  document.body.appendChild(o); spOverlays.push(o)
                })
              })
              document.addEventListener('keyup', function (e) { if (e.key === 'Alt') clearSpOverlays() })
              window.addEventListener('blur', clearSpOverlays)
            }

            // Capture phase, so an alt-click is claimed for editing before any
            // control treats it as an ordinary click. (The pen layer only draws
            // for pen input, so a mouse alt-click never leaves a stroke.)
            document.addEventListener('click', function (e) {
              if (!e.altKey || editing) return
              if (e.target.closest('#bar, #slideedit, .deck-edit-toast, [data-sp-overlay]')) return
              var slide = currentSlide()
              if (!slide) return
              e.preventDefault()
              e.stopPropagation()
              if (e.shiftKey) editHere(e.target, slide)
              else openSource(e.target, slide)
            }, true)

            // While the form is open it owns the keyboard, ahead of the deck's
            // own navigation handler.
            document.addEventListener('keydown', function (e) {
              if (!slideeditEl.classList.contains('on')) return
              if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); closeSlideForm() }
              else if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) {
                e.preventDefault(); e.stopPropagation(); saveSlideForm()
              } else {
                e.stopPropagation()   // typing must not page the deck
              }
            }, true)

            console.log('[deck] authoring enabled: alt-click opens source, ' +
                        'alt-shift-click edits. Local only.')
          }).catch(function () { /* edit-server not running: stay inert */ })
        })()

        /* --- slide review comments (authoring only) ------------------------
           Circle part of a slide, type a comment, and it lands in
           reviews/slide-comments.jsonl via scripts/review-server.py (:8928,
           started by ./preview-slides.sh) — where a Claude session picks it
           up ("watch my slide comments", see CLAUDE.md). The feedback loop
           for slide production: point at the problem instead of describing
           it in chat.

           Same self-effacing rules as the edit layer: localhost only, and
           the ◎ Review button appears only when the review server answers,
           so none of this exists for students or on the deployed deck.
           Everything below builds its own DOM/CSS — the only shared state
           it touches is read-only (deck, currentIndex, rect, sizeCanvas).

           Distinct from pen annotation on purpose: a review lasso is
           TRANSIENT (never saved as ink, cleared on send/cancel/slide
           change), and while review mode is on, an overlay swallows pointer
           input so nothing draws or navigates by accident. R toggles. */
        ;(function () {
          if (!/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) return
          var REVIEW_SERVER = 'http://127.0.0.1:' + (COURSE.reviewPort || 8928)

          var css = document.createElement('style')
          css.textContent =
            '#review-overlay { position: absolute; inset: 0; z-index: 5; display: none; cursor: crosshair; }' +
            '#review-overlay.on { display: block; }' +
            '#review-overlay canvas { position: absolute; inset: 0; width: 100%; height: 100%; }' +
            '#review-box { position: absolute; z-index: 6; width: 24em; max-width: 44%; background: #fff;' +
            '  border: 1px solid #d98324; border-radius: 8px; box-shadow: 0 6px 24px rgba(0,0,0,.25);' +
            '  padding: .6em; display: none; font-size: 14px; }' +
            '#review-box.on { display: block; }' +
            '#review-box textarea { width: 100%; height: 5em; box-sizing: border-box; resize: vertical;' +
            '  font: inherit; border: 1px solid #ccc9c0; border-radius: 5px; padding: .45em .55em; }' +
            '#review-box .rv-row { display: flex; gap: .5em; align-items: center; margin-top: .5em; }' +
            '#review-box .rv-hint { flex: 1; color: #86847c; font-size: .85em; }' +
            '#review-box button { font: inherit; border-radius: 5px; padding: .3em .9em; cursor: pointer; border: 1px solid #ccc9c0; background: #f4f2ee; }' +
            '#review-box button.rv-send { background: #d98324; border-color: #d98324; color: #fff; font-weight: 600; }' +
            '#review-toast { position: absolute; z-index: 7; left: 50%; transform: translateX(-50%); bottom: 46px;' +
            '  background: rgba(20,20,19,.92); color: #f2f2f2; padding: .5em 1em; border-radius: 6px;' +
            '  font-size: 13px; display: none; max-width: 80%; }' +
            '#review-toast.err { background: #8e2a20; }' +
            '#review-pins { position: absolute; inset: 0; z-index: 4; pointer-events: none; }' +
            '.review-pin { position: absolute; width: 22px; height: 22px; margin: -11px 0 0 -11px;' +
            '  border-radius: 50%; background: #d98324; color: #fff; font: 700 12px system-ui, sans-serif;' +
            '  display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 4px rgba(0,0,0,.4);' +
            '  pointer-events: auto; cursor: help; }'
          document.head.appendChild(css)

          var overlay = document.createElement('div')
          overlay.id = 'review-overlay'
          var lassoCanvas = document.createElement('canvas')
          overlay.appendChild(lassoCanvas)
          var lassoCtx = lassoCanvas.getContext('2d')
          var box = document.createElement('div')
          box.id = 'review-box'
          box.innerHTML =
            '<textarea placeholder="What should change here?"></textarea>' +
            '<div class="rv-row"><span class="rv-hint">⌘⏎ sends · Esc cancels</span>' +
            '<button type="button" class="rv-cancel">Cancel</button>' +
            '<button type="button" class="rv-send">Send</button></div>'
          var toastEl = document.createElement('div')
          toastEl.id = 'review-toast'
          // Persistent markers for comments still waiting in the queue for
          // THIS slide — so a comment that's been sent (and thus cleared from
          // the lasso) doesn't disappear from view entirely. A marker vanishes
          // on its own once "check my review comments" archives the line.
          var pinsEl = document.createElement('div')
          pinsEl.id = 'review-pins'
          // Under #bar in the DOM so the bar still wins hit-testing at z 6.
          var barEl = document.getElementById('bar')
          stage.insertBefore(pinsEl, barEl)
          stage.insertBefore(overlay, barEl)
          stage.insertBefore(box, barEl)
          stage.appendChild(toastEl)
          var field = box.querySelector('textarea')

          var reviewBtn = document.createElement('button')
          reviewBtn.id = 'review-btn'
          reviewBtn.type = 'button'
          reviewBtn.title = 'Review mode — circle something and comment; goes straight to Claude (R)'
          reviewBtn.innerHTML = '<span style="color:#d98324">◎</span> Review'
          reviewBtn.style.display = 'none'
          barEl.insertBefore(reviewBtn, document.getElementById('pos'))

          var reviewOn = false
          var lasso = null          // stroke in progress (normalized pts)
          var pending = null        // finished lasso waiting for its comment

          var toastTimer = null
          function toast(message, isErr) {
            toastEl.textContent = message
            toastEl.className = isErr ? 'err' : ''
            toastEl.style.display = 'block'
            clearTimeout(toastTimer)
            toastTimer = setTimeout(function () { toastEl.style.display = 'none' }, isErr ? 6000 : 3200)
          }

          function clearLasso() {
            lasso = null
            pending = null
            box.classList.remove('on')
            var r = rect()
            lassoCtx.clearRect(0, 0, r.width, r.height)
          }

          function setReview(on) {
            reviewOn = on
            overlay.classList.toggle('on', on)
            reviewBtn.classList.toggle('active', on)
            if (!on) clearLasso()
            else toast('Review mode — circle something, then type. R or Esc leaves.')
          }
          reviewBtn.addEventListener('click', function () { setReview(!reviewOn) })

          // Pins are independent of review mode — they show whether or not
          // you're actively circling, so a walk through the deck surfaces
          // what's still outstanding on each slide.
          var pinComments = []
          function renderPins() {
            pinsEl.innerHTML = ''
            var r = rect()
            pinComments.forEach(function (c, i) {
              if (!c.bbox) return
              var pin = document.createElement('div')
              pin.className = 'review-pin'
              pin.style.left = (c.bbox.x * r.width) + 'px'
              pin.style.top = (c.bbox.y * r.height) + 'px'
              pin.textContent = String(i + 1)
              pin.title = c.text
              pin.addEventListener('click', function (e) {
                e.stopPropagation()
                toast((i + 1) + ': ' + c.text)
              })
              pinsEl.appendChild(pin)
            })
          }
          function refreshPins() {
            fetch(REVIEW_SERVER + '/slide-comments').then(function (res) { return res.json() }).then(function (all) {
              var n = currentIndex()
              pinComments = all.filter(function (c) { return c.deck === deckId && c.slide === n && !c.kind })
              renderPins()
            }).catch(function () {})
          }

          function drawLasso() {
            sizeCanvas(lassoCanvas, lassoCtx)
            var r = rect()
            lassoCtx.clearRect(0, 0, r.width, r.height)
            var pts = (lasso || pending || {}).pts
            if (!pts || pts.length < 2) return
            lassoCtx.strokeStyle = '#d98324'
            lassoCtx.lineWidth = 2.5
            lassoCtx.setLineDash([7, 5])
            lassoCtx.beginPath()
            lassoCtx.moveTo(pts[0][0] * r.width, pts[0][1] * r.height)
            for (var i = 1; i < pts.length; i++) lassoCtx.lineTo(pts[i][0] * r.width, pts[i][1] * r.height)
            lassoCtx.stroke()
            lassoCtx.setLineDash([])
          }

          // The overlay swallows pointer input so the annotation and laser
          // handlers on #stage (a parent, reached by bubbling) never see it.
          overlay.addEventListener('pointerdown', function (e) {
            e.stopPropagation(); e.preventDefault()
            if (box.classList.contains('on')) return   // finish the open comment first
            try { overlay.setPointerCapture(e.pointerId) } catch (err) {}
            lasso = { pts: [point(e)] }
          })
          overlay.addEventListener('pointermove', function (e) {
            e.stopPropagation()
            if (!lasso) return
            e.preventDefault()
            var p = point(e)
            if (farEnough(p, lasso.pts[lasso.pts.length - 1])) {
              if (lasso.pts.length < 400) lasso.pts.push(p)
              drawLasso()
            }
          })
          overlay.addEventListener('pointerup', function (e) {
            e.stopPropagation()
            if (!lasso) return
            if (lasso.pts.length < 3) { clearLasso(); drawLasso(); return }  // a stray click
            pending = lasso
            lasso = null
            openBox(e)
          })
          overlay.addEventListener('touchmove', function (e) { e.preventDefault() }, { passive: false })

          function openBox(e) {
            var r = rect()
            box.classList.add('on')
            // Beside the pointer, clamped so it never leaves the stage or
            // covers the bar.
            var bw = box.offsetWidth, bh = box.offsetHeight
            var x = Math.min(Math.max(8, e.clientX - r.left + 14), r.width - bw - 8)
            var y = Math.min(Math.max(8, e.clientY - r.top - bh / 2), r.height - bh - 44)
            box.style.left = x + 'px'
            box.style.top = y + 'px'
            field.value = ''
            field.focus()
          }

          function bbox(pts) {
            var xs = pts.map(function (p) { return p[0] }), ys = pts.map(function (p) { return p[1] })
            var x0 = Math.min.apply(null, xs), y0 = Math.min.apply(null, ys)
            return { x: r4(x0), y: r4(y0), w: r4(Math.max.apply(null, xs) - x0), h: r4(Math.max.apply(null, ys) - y0) }
          }

          function send() {
            var text = field.value.trim()
            if (!text || !pending) return
            var slide = deck && deck.slides[currentIndex() - 1]
            var payload = {
              ts: new Date().toISOString(),
              deck: deckId,
              deckTitle: (deck && deck.title) || deckId,
              slide: currentIndex(),
              jsonIndex: slide ? slide._ink : null,
              title: document.getElementById('title').textContent,
              type: slide ? (slide.type || 'ref') : null,
              student: studentView,
              url: location.href,
              bbox: bbox(pending.pts),
              stroke: pending.pts,
              text: text,
            }
            // No Content-Type header: keeps this a "simple" CORS request, so
            // there is no preflight to fail if the server is slow to start.
            post(payload)
              .then(function (queued) {
                clearLasso(); drawLasso()
                refreshPins()
                toast('✓ queued for Claude — ' + queued + ' waiting')
              })
              .catch(function () {
                // The server is down — reviewing is batch work, so Petra may
                // well be circling slides while the whole preview stack is
                // stopped for corrections. Buffer the comment in THIS
                // browser and keep going; the outbox flushes the moment the
                // server answers again (retry below, or a reload).
                try {
                  var out = outbox()
                  out.push(payload)
                  localStorage.setItem(OUTBOX_KEY, JSON.stringify(out))
                  clearLasso(); drawLasso()
                  toast('⏳ saved in this browser (' + out.length + ') — sends itself when the review server is back')
                  scheduleFlush()
                } catch (err) {
                  // Storage refused too: keep the box so the text survives.
                  toast('Could not send or save — start the slides authoring preview (Launchpad) or: python3 scripts/review-server.py', true)
                }
              })
          }

          function post(payload) {
            return fetch(REVIEW_SERVER + '/slide-comment', { method: 'POST', body: JSON.stringify(payload) })
              .then(function (res) { return res.json() })
              .then(function (body) {
                if (!body.ok) throw new Error(body.error || 'refused')
                return body.queued
              })
          }

          /* The outbox: comments made while the review server was down.
             Flushed in order, oldest first; each success is removed from
             storage immediately, so a flush interrupted halfway loses
             nothing and re-sends nothing. */
          var OUTBOX_KEY = 'deck:review:outbox'
          function outbox() {
            try {
              var raw = localStorage.getItem(OUTBOX_KEY)
              var p = raw ? JSON.parse(raw) : []
              return Array.isArray(p) ? p : []
            } catch (err) { return [] }
          }
          var flushTimer = null
          function scheduleFlush() {
            clearTimeout(flushTimer)
            flushTimer = setTimeout(flushOutbox, 15000)
          }
          function flushOutbox() {
            clearTimeout(flushTimer)
            var out = outbox()
            if (!out.length) return
            post(out[0])
              .then(function (queued) {
                var rest = outbox()
                // Remove the sent comment by identity (ts), not position —
                // a new comment may have been buffered mid-flight.
                rest = rest.filter(function (c) { return c.ts !== out[0].ts })
                localStorage.setItem(OUTBOX_KEY, JSON.stringify(rest))
                if (rest.length) flushOutbox()
                else { refreshPins(); toast('✓ saved comments sent — ' + queued + ' waiting for Claude') }
              })
              .catch(function () { scheduleFlush() })   // still down; try again
          }
          box.querySelector('.rv-send').addEventListener('click', send)
          box.querySelector('.rv-cancel').addEventListener('click', function () { clearLasso(); drawLasso() })
          field.addEventListener('keydown', function (e) {
            e.stopPropagation()   // typing must not page the deck or toggle modes
            if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); send() }
            else if (e.key === 'Escape') { clearLasso(); drawLasso() }
          })

          document.addEventListener('keydown', function (e) {
            if (e.metaKey || e.ctrlKey || e.altKey) return
            var t = e.target
            if (t && (t.tagName === 'TEXTAREA' || t.tagName === 'INPUT' || t.isContentEditable)) return
            if (e.key === 'r' || e.key === 'R') setReview(!reviewOn)
            else if (e.key === 'Escape' && reviewOn) setReview(false)
          })

          // A lasso's coordinates mean nothing on another slide; pins do, so
          // refetch them for whatever slide this now is.
          window.addEventListener('hashchange', function () {
            if (reviewOn) { clearLasso(); drawLasso() }
            refreshPins()
          })
          window.addEventListener('resize', function () { if (reviewOn) drawLasso(); renderPins() })
          // Reasserting focus (e.g. coming back from a Claude session that
          // just archived a comment) is the cheapest moment to notice a pin
          // should now be gone.
          window.addEventListener('focus', refreshPins)

          // The button appears only when the review server answers — the same
          // self-effacement as the edit layer, so a rehearsal or the deployed
          // deck never shows it. ?review opens the mode directly. Either way,
          // a non-empty outbox keeps trying: comments buffered while the
          // stack was down must reach the queue file without being asked.
          fetch(REVIEW_SERVER + '/health').then(function (res) { return res.json() }).then(function (body) {
            if (!body.ok) return
            reviewBtn.style.display = ''
            if (params.has('review')) setReview(true)
            flushOutbox()
            refreshPins()
          }).catch(function () {
            if (outbox().length) scheduleFlush()   // review server not running: UI stays inert, outbox keeps trying
          })
        })()
      })()
    </script>
  </body>
</html>
