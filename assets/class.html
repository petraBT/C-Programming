<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Class</title>
    <!-- course.js is the one per-course file: window.COURSE = {name, pdfPrefix,
         editPort, reviewPort, swipe, swipeOneFinger, scripts}; the ports default to 8927/8928 and only need
         setting where two projects run side by side; scripts is a list of extra files to load. -->
    <script src="course.js"></script>
    <script>window.COURSE = window.COURSE || { name: '', pdfPrefix: '' }
      window.COURSE.label = window.COURSE.name ? window.COURSE.name + ' — ' : ''
      document.title = window.COURSE.label + 'Class'</script>
    <style>
      /* Classroom deck player — static, no backend. A deck (decks/*.json)
         is a thin PLAYLIST: most slides are `ref` slides that pull a hidden
         <slide> block out of a built book page (one source of truth); the rest
         are short in-class glue (title/section/agenda/recap/prompt) rendered
         here. Pinned to light so the projector and every laptop agree. */
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      html, body {
        overscroll-behavior: none;     /* a sideways trackpad swipe turns slides; it must not go Back, and nothing rubber-bands */
        margin: 0; height: 100%; background: #111; color: #1a1a19;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        overflow: hidden;
      }
      #stage-wrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
      /* Strict 16:9 box letterboxed into the room's projector; type is sized
         against the stage (cqmin), not the viewport, so a slide lays out the
         same on the projector and an iPad. */
      #stage {
        position: relative;
        width: min(100vw, calc(100vh * 16 / 9));
        height: min(100vh, calc(100vw * 9 / 16));
        background: #fff; overflow: hidden; container-type: size;
        -webkit-user-select: none; user-select: none;
        /* Pan (one finger scrolls a long code slide) but no pinch-zoom: a zoomed
           or shifted slide put the marks away from the Pencil. */
        touch-action: pan-x pan-y;
      }
      .slide { position: absolute; inset: 0; display: none; flex-direction: column; }
      .slide.on { display: flex; }

      /* Every slide's deck title, uniform across types. */
      .slide h2.deck-title {
        margin: 0; padding: 2.4% 4% 0 4%;
        font-size: 3.2vmin; font-size: 3.2cqmin; font-weight: 600; color: #256abf;
        letter-spacing: .01em; text-transform: uppercase;
      }
      .slide h2.deck-title:empty { display: none; }

      /* --- glue slides (title / section / agenda / recap / prompt) --------- */
      /* Content-bearing glue (agenda / notice / recap / prompt) top-aligns so its
         blue heading sits at the top, consistent with the ref slides. Only the
         "title" and "section" dividers (.center) are vertically centered. */
      #glue { padding: 5.5% 7%; justify-content: flex-start; }
      #glue.top { justify-content: flex-start; }
      #glue h2 {
        margin: 0 0 .6em 0; font-size: 3.1vmin; font-size: 3.1cqmin; font-weight: 600;
        letter-spacing: .01em; color: #256abf; text-transform: uppercase;
      }
      /* Prompt/notice body. Large so it reads from the back, but NOT bold:
         a whole paragraph at weight 600 reads as shouting (Petra, 2026-08-08,
         "everything is bold faced ... I really don't like those"). Emphasis
         inside the body still works, because <b> and <term> set their own
         weight. */
      /* Body/lead lines used to be 4.6cqmin — a third larger than the bullets
         beside them. Petra, 2026-09-13, circling five of them in one pass:
         "Why is this in such a big font compared to everything else?" Now the
         same size as a list item (3.4cqmin), kept regular weight. */
      #glue .big { font-size: 3.4vmin; font-size: 3.4cqmin; font-weight: 400; line-height: 1.5; margin: 0 0 .6em 0; }
      #glue .sub { font-size: 2.8vmin; font-size: 2.8cqmin; color: #52514e; margin: .2em 0 0 0; }
      #glue ul { margin: 0; padding: 0; list-style: none; }
      #glue li {
        font-size: 3.4vmin; font-size: 3.4cqmin; line-height: 1.55; margin-bottom: .7em;
        padding-left: 1.4em; position: relative;
      }
      #glue li::before {
        content: ""; position: absolute; left: 0; top: .55em;
        width: .5em; height: .5em; border-radius: 50%; background: #2a78d6;
      }
      /* Blank-cell table a prompt hands out for students to fill in (a kind="prompt"
         slide whose body holds a <tabular>: header row, then one row label per
         line). The cells are empty on purpose, so they need a minimum size to read
         as somewhere to write. */
      #glue table { border-collapse: collapse; margin: .4em 0 0 0; font-size: 2.7vmin; font-size: 2.7cqmin; }
      #glue th, #glue td { border: 1px solid #a9a79e; padding: .5em 1.2em; text-align: left; }
      #glue td { min-width: 9em; height: 2.4em; }
      #glue thead th { background: #f0efec; font-weight: 600; }
      #glue tbody th { font-weight: 500; }
      #glue .note { font-size: 2.6vmin; font-size: 2.6cqmin; color: #52514e; margin-top: .8em; line-height: 1.5; }
      /* "room": "compressed" on a glue slide (agenda / recap / notice): tighten
         the gaps between items so one more line fits, without touching the type
         size -- the same rule the ref slides follow.  Petra, 2026-09-21, on
         Day 9's recap after it gained the optional-homework line: "a bit too
         large - can you use a compact to make it fit?" */
      #glue.compressed h2 { margin-bottom: .3em; }
      #glue.compressed li { margin-bottom: .2em; }
      #glue code { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: .92em; background: #f0efec; padding: .12em .38em; border-radius: 4px; }
      /* A "title" slide and a "section" divider are centered statements. */
      #glue.center { align-items: center; text-align: center; justify-content: center; }
      #glue .title-main { font-size: 6vmin; font-size: 6cqmin; font-weight: 700; color: #1a1a19; line-height: 1.15; }
      #glue .section-kicker { font-size: 2.6vmin; font-size: 2.6cqmin; text-transform: uppercase; letter-spacing: .12em; color: #2a78d6; margin-bottom: .5em; }
      #glue .section-main { font-size: 5vmin; font-size: 5cqmin; font-weight: 700; color: #1a1a19; }

      /* --- ref slides (extracted from a built book page) ------------------- */
      #ref { padding: 3.2% 4% 3.2% 4%; }
      /* The deck's own title aligns flush with the content below it (no extra
         inset) and leaves a clear gap beneath. */
      #ref .deck-title { padding: 0; margin: 0 0 .7em 0; }
      /* Two-column (figure) slides center their content vertically, so a short
         bullet list doesn't sit top-left with dead space beneath it. */
      #ref .ref-cols { flex: 1; min-height: 0; display: flex; gap: 4%; align-items: center; }
      #ref .ref-body { flex: 1; min-width: 0; min-height: 0; }
      /* .ref-cols centres its children, so an over-full bullet column did not
         clip — it GREW past the slide in both directions, printing its first
         bullets over the title and losing its last off the bottom, while
         scrollHeight === clientHeight and the fit check answered "fits".
         Day 11's counter/compare slide was 196 px over and measured clean.
         Cap it against the column so the overflow is real and measurable. */
      #ref .ref-cols .ref-body { max-height: 100%; overflow: auto; }
      #ref .ref-media { flex: 1.05; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
      #ref.single .ref-media { display: none; }
      /* Single-column (activity / code) slides fill the height and top-align; if
         the content is taller than the stage it scrolls rather than being
         clipped. Extracted PreTeXt content is styled below for the projector (it
         arrives without the book stylesheet), scoped under #ref. */
      #ref.single .ref-cols { align-items: stretch; }
      #ref.single .ref-body { flex: 1; overflow: auto; }
      /* Image-dominant slide: a complex diagram IS the content, so it fills the
         slide (title above, short caption below) rather than sitting beside
         bullets. Triggered when a figure-ref slide carries no bullet text. */
      #ref.figure-focus .ref-cols { align-items: stretch; }
      #ref.figure-focus .ref-body { display: none; }
      #ref.figure-focus .ref-media { flex: 1; }
      /* Leave room below the image for the (short) caption so it isn't clipped. */
      #ref.figure-focus .ref-media img { max-height: 72cqh; }
      /* mediawide="yes": keep the two columns but give most of the width to the
         figure, for an image whose detail does not survive a half-slide (a scope
         screenshot, a pinout).  The bullets still wrap readably at this width. */
      #ref.media-wide .ref-body { flex: .58; }
      #ref.media-wide .ref-media { flex: 1.75; }
      /* mediawide="slight": the same move, one step gentler, for a slide whose
         bullets will not survive a quarter-width column.  Day 2's breadboard
         slide is the case -- Petra asked for a bigger picture "there should
         still be enough room for the text on the left" and the full setting
         clipped four bullets by 106px. */
      #ref.media-wide-slight .ref-body { flex: .82; }
      #ref.media-wide-slight .ref-media { flex: 1.38; }
      /* Stacked layout (slide stack="yes"): bullets span the full width on top,
         the figure sits full-width below so a wide image can be much larger. */
      #ref.stacked .ref-cols { flex-direction: column; align-items: stretch; gap: 1.5%; }
      #ref.stacked .ref-body { flex: none; }
      #ref.stacked .ref-media { flex: 1; min-height: 0; }
      /* Cap the stacked image by stage height (not 100% of an unconstrained box) so
         it — and its caption below — fit under the bullets instead of being clipped. */
      #ref.stacked .ref-media img { max-height: 55cqh; }
      /* stack="side": the same stacked slide, but the instructive caption sits to
         the right of the figure instead of under it, so a wide-but-short figure
         under long bullets gets the full height that is left.  Petra,
         2026-10-01, on Day 10's reference-manual figure: "there is room to the
         right of the figure for the caption". */
      #ref.stacked.caption-side .ref-media { flex-direction: row; align-items: center; gap: 3%; }
      #ref.stacked.caption-side .ref-media > :not(.slide-caption) { flex: 1 1 0; min-width: 0; height: 100%; }
      #ref.stacked.caption-side .ref-media img { max-height: 100%; }
      #ref.stacked.caption-side .slide-caption { flex: 0 0 24%; max-width: 24%; text-align: left; margin: 0; }
      #ref .ref-body p, #ref .ref-body .para { font-size: 3vmin; font-size: 3cqmin; line-height: 1.6; margin: 0 0 .85em 0; }
      /* Unordered lists get a dot; ordered lists (activity tasks) keep numbers. */
      #ref .ref-body ul { margin: 0; padding: 0; list-style: none; }
      #ref .ref-body ul > li {
        font-size: 3.1vmin; font-size: 3.1cqmin; line-height: 1.6; margin-bottom: .9em;
        padding-left: 1.3em; position: relative;
      }
      #ref .ref-body ul > li:last-child { margin-bottom: 0; }
      #ref .ref-body ul > li::before {
        content: ""; position: absolute; left: 0; top: .6em;
        width: .45em; height: .45em; border-radius: 50%; background: #2a78d6;
      }
      #ref .ref-body ol { margin: .2em 0; padding-left: 1.5em; }
      #ref .ref-body ol > li { font-size: 2.7vmin; font-size: 2.7cqmin; line-height: 1.55; margin-bottom: .65em; padding-left: .2em; }
      /* The bullet list has had this since it was written; the NUMBERED list did
         not, so the last item's trailing margin — 65 px on a 1600x900 stage —
         counted as overflow and pushed slides over that were visibly fine. Day
         11x's questions slide measured 18 px over with 65 px of empty space
         under it. */
      #ref .ref-body ol > li:last-child { margin-bottom: 0; }
      /* Practice slides (room="yes" on a slide, or "room": true on a deck ref):
         leave a couple of blank lines after each item / task for students — and
         the instructor — to write an answer during class. */
      #ref .ref-body.roomy > ol > li,
      #ref .ref-body.roomy > ul > li,
      #ref .ref-body.roomy > .para > ol > li,
      #ref .ref-body.roomy > .para > ul > li,
      #ref .ref-body.roomy > p > ol > li,
      #ref .ref-body.roomy > p > ul > li,
      #ref .ref-body.roomy .task { margin-bottom: 2.7em; }
      /* Not after the LAST one. The writing space between items is the point;
         the copy of it below the final item is against the bottom of the slide,
         where it buys nothing and counts as overflow — 65 px of it put Day 11x's
         questions slide 18 px over once Petra promoted the early-finisher line
         to a fourth question. */
      #ref .ref-body.roomy > ol > li:last-child,
      #ref .ref-body.roomy > ul > li:last-child,
      #ref .ref-body.roomy > .para > ol > li:last-child,
      #ref .ref-body.roomy > .para > ul > li:last-child,
      #ref .ref-body.roomy > p > ol > li:last-child,
      #ref .ref-body.roomy > p > ul > li:last-child,
      #ref .ref-body.roomy .task:last-child { margin-bottom: 0; }
      /* The opposite setting (room="compressed" / "room": "compressed"): tighten
         the gaps between items so a long activity fits on one slide without any
         of its content being cut. Type size is untouched — only the spacing —
         so this buys room without making anything harder to read from the back
         of the room. Use it instead of deleting tasks (S-9). */
      #ref .ref-body.compressed p,
      #ref .ref-body.compressed .para { margin-bottom: .3em; }
      #ref .ref-body.compressed ul > li { margin-bottom: .35em; }
      #ref .ref-body.compressed ol > li { margin-bottom: .18em; }
      #ref .ref-body.compressed .task { margin-bottom: .25em; }
      #ref .ref-body.compressed .task > p:last-child,
      #ref .ref-body.compressed p:last-child { margin-bottom: 0; }
      /* Inline code never breaks mid-token.  A browser treats the hyphen in
         `GPIOA->ODR` as a break opportunity, so a bullet could end a line with
         "GPIOA-" and start the next with ">ODR" -- Petra, Day 7x, 2026-09-15:
         "awkward line-break - any ideas how to fix?".  nowrap makes each span
         an unbreakable inline box that moves to the next line whole; the
         longest inline span in any projected block is 63 characters, which
         still fits a slide line, and long listings use <program> anyway. */
      #ref code { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: .9em; background: #f0efec; padding: .1em .35em; border-radius: 4px; white-space: nowrap; }
      #ref pre code, #ref pre.program code { white-space: pre; }
      /* Extracted activity/exercise markup (arrives without the book stylesheet). */
      #ref .activity, #ref article, #ref .exercise-like { margin: 0; }
      /* The activity's own "Activity 2.2.N." heading duplicates the deck title
         above it, so hide it (the deck title already names the activity). It is
         a top-level child of .ref-body because renderRef unwraps the activity. */
      #ref .ref-body > .heading { display: none; }
      #ref .introduction { margin: 0 0 .5em 0; }
      /* Each task's (a)/(b) label sits in a reserved left gutter (hanging indent),
         so the task's content — a paragraph OR a bulleted list — always starts to
         its right and never overlaps a list bullet. */
      #ref .task { position: relative; padding-left: 2.9em; margin: 0 0 .95em 0; }
      #ref .task > .heading {
        position: absolute; left: 0; top: 0; margin: 0; font-weight: 600; color: #256abf;
        font-size: 3vmin; font-size: 3cqmin; line-height: 1.6;
        /* The gutter has to clear the widest label plus a real gap, or "(a)" runs
           straight into the first word of the task. */
        width: 2.5em; padding-right: .4em; box-sizing: border-box;
      }
      #ref .task > .heading .codenumber { color: #256abf; }
      /* A <task> with its own <title> renders "(a) Trace." into that same heading,
         and a title does not fit a 2.5em gutter — it wrapped underneath the label
         and printed straight through the task's text. renderRef folds the label and
         title into the front of the task's first paragraph instead, which reads the
         way the book does and costs no vertical space. */
      #ref .task.titled-task { padding-left: 0; }
      #ref .task-lead { color: #256abf; font-weight: 600; }
      /* Math variables (see mathify): italic head + real subscript, so V_BE and
         h_FE read as symbols rather than as identifiers with an underscore. */
      #ref .mvar { font-style: italic; }
      #ref .mvar + sub { font-size: .68em; font-style: italic; line-height: 0; vertical-align: baseline;
                         position: relative; bottom: -.28em; padding-left: .04em; }
      #ref pre.program {
        font-family: "SFMono-Regular", Consolas, Menlo, monospace;
        font-size: 2.3vmin; font-size: 2.3cqmin; line-height: 1.55; margin: .3em 0;
        background: #f7f6f3; border: 1px solid #ddd9d0; border-radius: 6px;
        padding: 1.1em 1.3em; white-space: pre; overflow: auto;
      }
      #ref pre.program code { background: none; padding: 0; font-size: 1em; }
      /* code="small" on a <slide>: the listing at 95% of the code size, for a
         slide that has to show two listings side by side (Day 5's jigsaw, all
         four groups at once).  Only this slide's code changes; the text keeps
         its size. */
      #ref .ref-body.code-small pre.program { font-size: 2.19vmin; font-size: 2.19cqmin; }
      /* Syntax colours (highlightC), lifted from the coding window's theme. */
      #ref pre .t-keyword { color: #708; } #ref pre .t-type { color: #085; }
      #ref pre .t-number { color: #164; } #ref pre .t-comment { color: #a50; }
      #ref pre .t-string { color: #a11; } #ref pre .t-meta { color: #555; }
      /* A board simulator projected as a demo slide (a <slide> whose body is a
         <sim>). The book page's own breakout rule — which widens the embed past
         the reading column — rides along inside the extracted markup, so undo it
         here and just fill the slide. The "open in a new tab" link is for readers
         of the book, not for the projector. */
      #ref .ref-body > .sim-embed, #ref .sim-embed {
        width: 100%; margin: 0;
      }
      #ref .sim-embed iframe { width: 100%; height: 100%; border: 0; display: block; }
      #ref .sim-embed-links { display: none; }
      /* Outside a <slide> a <sim> is a new-tab button, and nothing projected
         carries a link (L-21). */
      #ref .sim-link { display: none; }
      /* A demo slide is its lead-in line stacked over the tool, and the tool
         takes every pixel that is left — the simulator needs width for its
         editor / board / registers columns, and height for the board. */
      #ref .ref-body.has-sim { display: flex; flex-direction: column; overflow: hidden; }
      #ref .ref-body.has-sim > .sim-embed { flex: 1; min-height: 0; }
      /* The resolved figure (image + caption). */
      #ref .ref-media figure, #ref .ref-media .figure-like { margin: 0; text-align: center; }
      /* Fill the available column with the figure. The book sizes images small
         (e.g. width:55%) for the reading page; on a slide we want them as large
         as the space allows, so override that and let the image use the column.

         The figure has to be a flex COLUMN that stretches to the media box, and
         the image-box the flex item that absorbs what the caption does not use.
         Without this the figure is shrink-to-fit (`.ref-media` centres its
         children on the cross axis), so the image renders at its intrinsic
         pixel size: too small on a wide slide, and — because `.ref-media` is
         `overflow: hidden` — silently CROPPED whenever the bullets above leave
         it less room than the image's natural height. That is the crop that
         reads as zero on every overflow measurement, and it ate the "Message"
         label off the top of `i2c_message_frame.svg` at 1280x720. With the
         image sized by the box instead, `object-fit: contain` letterboxes it
         and it can never be cut. */
      #ref .ref-media > figure,
      #ref .ref-media > .figure-like {
        width: 100%; height: 100%; min-height: 0;
        display: flex; flex-direction: column; justify-content: center;
      }
      #ref .ref-media .image-box { width: 100% !important; margin: 0 !important;
                                   flex: 1 1 auto; min-height: 0; display: flex; }
      #ref .ref-media img { width: 100%; max-width: 100%; height: 100%;
                            max-height: 72cqh; object-fit: contain; }
      /* Guard against any figure spilling past the slide, and re-enable the CSS
         grid a PreTeXt <sidebyside> uses (without the book stylesheet its panels
         would stack and overflow instead of sitting in a row). */
      #ref .ref-media { max-height: 100%; overflow: hidden; }
      #ref .sbsrow { display: grid; align-items: center; }
      /* columns="top" on a <slide>: its side-by-side panels start at the top
         instead of centering, so two listings of different lengths begin on
         the same line.  Opt-in, so no existing slide moves. */
      #ref .ref-body.cols-top .sbsrow { align-items: start; }
      #ref .sbspanel .image-box { margin: 0 !important; }
      /* A <sidebyside> figure would otherwise shrink-wrap inside the centering
         flex column and collapse its percentage panels to a fraction of the space.
         Make it fill the media column and drop the book's outer row margins so the
         two images are as large as the slide allows. */
      #ref .ref-media .sidebyside { width: 100%; }
      #ref .ref-media .sbsrow { margin-left: 0 !important; margin-right: 0 !important; }
      #ref .ref-media figcaption, #ref .ref-media .figure-caption {
        font-size: 2.3vmin; font-size: 2.3cqmin; color: #52514e; line-height: 1.4; margin-top: .6em;
      }
      #ref .ref-media .autopermalink, #ref .autopermalink { display: none; }
      /* A slide's own instructive caption, under the figure (or under a table /
         other non-image ref, where it lives in the body column instead). */
      #ref .slide-caption {
        font-size: 2.5vmin; font-size: 2.6cqmin; color: #52514e; line-height: 1.45;
        margin-top: .7em; text-align: center; max-width: 92%; margin-left: auto; margin-right: auto;
      }
      #ref .slide-caption p, #ref .slide-caption .para { margin: 0; font-size: inherit; }
      /* PreTeXt encodes each cell's alignment as a single-letter class (c/l/r for
         horizontal, m/t/b for vertical); the border classes carry a digit (l1, t0).
         The reading build's stylesheet defines these, but the deck player didn't —
         so a centered data cell fell back to left-aligned and sat under the wrong
         header. Honor them here (the digit-suffixed border classes are untouched). */
      #ref table.tabular td.l, #ref table.tabular th.l { text-align: left; }
      #ref table.tabular td.c, #ref table.tabular th.c { text-align: center; }
      #ref table.tabular td.r, #ref table.tabular th.r { text-align: right; }
      #ref table.tabular td.m, #ref table.tabular th.m { vertical-align: middle; }
      #ref table.tabular td.t, #ref table.tabular th.t { vertical-align: top; }
      #ref table.tabular td.b, #ref table.tabular th.b { vertical-align: bottom; }
      /* Cell borders: PreTeXt marks each edge with a digit class (1 = minor, 2 =
         major). The reading build draws them; the deck player didn't, so tables
         (and register diagrams built as tables) showed no grid lines. */
      /* Standalone tables (register diagrams, etc.) get clear space above and
         below so they don't crowd the lead line and the bullets. */
      /* An <image> that is NOT in a <figure> — a typeset equation inside an
         activity, say — keeps its PreTeXt image-box, but nothing was sizing the
         <img> inside it, so it rendered at its intrinsic pixel size and the
         declared width did nothing. Day 11's equilibrium equation measured the
         same at 38% and at 30%. */
      #ref .ref-body .image-box { margin-left: auto !important; margin-right: auto !important; }
      #ref .ref-body .image-box img { display: block; width: 100%; height: auto; }
      /* A <video> has the same problem one step worse. PreTeXt sizes its
         .video-box with the padding-top aspect-ratio trick and absolutely
         positions the <iframe> inside it — both of which live in the book
         stylesheet the player does not load, so the embed collapsed to a
         thumbnail in the bottom-left corner while the box reserved a screenful
         of empty space above it. Drive the box from its HEIGHT instead: an
         explicit aspect-ratio with `width: auto` keeps 16:9 while the cap keeps
         the player inside the slide, which the width-driven padding trick
         cannot do. */
      #ref .ref-body .video-box {
        position: relative; padding-top: 0 !important;
        aspect-ratio: 16 / 9; height: 58cqh; width: auto !important;
        max-width: 100%; margin: .6em auto !important;
      }
      #ref .ref-body .video-box iframe, #ref .ref-body .video-box .video {
        position: absolute; inset: 0; width: 100%; height: 100%; border: 0;
      }
      /* A table ref'd onto a slide brings its book label with it — "Table
         11.3.3." and all — with margin 0 on every side, so the label sat hard
         against the header row with not one pixel between them. And the
         numbering is book chrome: nobody reads "Table 11.3.3" off a wall. Keep
         the descriptive half of the label, drop the number, and give it room. */
      #ref .ref-body figcaption {
        display: block; margin: .2em 0 .85em; line-height: 1.35; opacity: .8;
      }
      #ref .ref-body figcaption > .type,
      #ref .ref-body figcaption > .codenumber,
      #ref .ref-body figcaption > .heading-divison-mark { display: none; }
      /* room="yes" on a slide whose body is a TABLE: the writing room has to go
         into the rows, not between paragraphs. A fill-in table (the register
         checkpoint on Day 11x) is the case — students write one answer per row
         and the instructor fills the column in on the projector. */
      #ref .ref-body.roomy table.tabular td { padding-top: .3em; padding-bottom: .3em; }
      /* PreTeXt wraps every <tabular> in <div class="tabular-box">, so the rule
         below -- written against table.tabular itself -- never matched anything
         and a slide's table sat hard against the paragraph above it with the
         slack all left at the bottom.  Petra found it three times across two
         decks (2026-09-18/20): "everything appears crammed at the top",
         "create a bit more space above and below the table", and "leave space
         around the table, especially underneath.  You have tons of space on
         this slide."  Keep both selectors: the box is what ships. */
      #ref .ref-body > table.tabular { margin: 1.2em 0; }
      #ref .ref-body .tabular-box { margin: 2.8em 0; }
      #ref .ref-body .tabular-box:first-child { margin-top: 0; }
      #ref .ref-body .tabular-box:last-child { margin-bottom: 0; }
      #ref .ref-body.compressed .tabular-box { margin: .55em 0; }
      #ref table.tabular { border-collapse: collapse; }
      /* Extracted book markup arrives without the book stylesheet, so a table
         kept the browser's 16px while the prose around it scaled with the
         projector — Day 11's parameter table was a quarter smaller than the
         question above it. Size it like a list item instead, so it grows with
         the slide. The wide-table rule below is more specific and still wins. */
      #ref table.tabular { font-size: 2.7vmin; font-size: 2.7cqmin; }
      #ref table.tabular td, #ref table.tabular th { padding: .28em .5em; }
      /* A wide register diagram (10+ columns, e.g. a full 16-bit register) shrinks
         its type so the whole row fits the slide width; narrower tables (truth
         tables, 8-bit registers) keep the readable default size. */
      #ref table.tabular:has(tr > :nth-child(10)) { font-size: 2vmin; font-size: 2.15cqmin; }
      #ref table.tabular:has(tr > :nth-child(10)) td, #ref table.tabular:has(tr > :nth-child(10)) th { padding: .18em .22em; }
      #ref table.tabular td.l1, #ref table.tabular th.l1 { border-left: 1px solid #b8b6b2; }
      #ref table.tabular td.r1, #ref table.tabular th.r1 { border-right: 1px solid #b8b6b2; }
      #ref table.tabular td.t1, #ref table.tabular th.t1 { border-top: 1px solid #b8b6b2; }
      #ref table.tabular td.b1, #ref table.tabular th.b1 { border-bottom: 1px solid #b8b6b2; }
      #ref table.tabular td.l2, #ref table.tabular th.l2 { border-left: 2px solid #6b6a67; }
      #ref table.tabular td.r2, #ref table.tabular th.r2 { border-right: 2px solid #6b6a67; }
      #ref table.tabular td.t2, #ref table.tabular th.t2 { border-top: 2px solid #6b6a67; }
      #ref table.tabular td.b2, #ref table.tabular th.b2 { border-bottom: 2px solid #6b6a67; }
      /* PreTeXt numbers its rules 1 minor, 2 medium, 3 MAJOR, and only 1 and 2
         were styled here — so top="major" / bottom="major" drew nothing on a
         slide. Day 11's parameter table projected with no line under its header
         row while every minor line between the data rows showed. */
      #ref table.tabular td.l3, #ref table.tabular th.l3 { border-left: 3px solid #3a3936; }
      #ref table.tabular td.r3, #ref table.tabular th.r3 { border-right: 3px solid #3a3936; }
      #ref table.tabular td.t3, #ref table.tabular th.t3 { border-top: 3px solid #3a3936; }
      #ref table.tabular td.b3, #ref table.tabular th.b3 { border-bottom: 3px solid #3a3936; }
      /* Inline colour for slide text (see the <clr> element in engs28-html.xsl),
         e.g. matching oscilloscope-channel colours. */
      #ref .deck-clr-orange { color: #c26a1f; font-weight: 600; }
      #ref .deck-clr-blue { color: #2158a8; font-weight: 600; }
      #ref .deck-clr-red { color: #c0392b; font-weight: 600; }
      #ref .deck-clr-green { color: #1a7f37; font-weight: 600; }

      #err { padding: 8cqmin; font-size: 3cqmin; color: #b3261e; display: none; }
      #err.on { display: block; }

      /* --- chrome --------------------------------------------------------- */
      #bar {
        position: absolute; left: 0; right: 0; bottom: 0; height: 34px; z-index: 6;
        display: flex; align-items: center; gap: 14px; padding: 0 14px;
        background: rgba(13,13,13,.86); font-size: 12px; color: #c3c2b7; border-top: 1px solid #2c2c2a;
      }
      #bar .spacer { flex: 1; }
      #bar button { font: inherit; color: #ccc; background: transparent; border: 1px solid #3a3a38; border-radius: 4px; padding: 3px 9px; cursor: pointer; }
      #bar button:hover { background: #232322; }
      #title { color: #f2f2f2; font-weight: 600; }
      #instr-badge { display: none; margin-left: 12px; color: #d9a441; font-weight: 600; }
      #bar.instr #instr-badge { display: inline; }
      /* A private slide (instructor="private"): never projected. It is only in the
         sequence at all while review mode is on (P), and the bar says so loudly. */
      #private-badge { display: none; margin-left: 12px; color: #ff8a80; font-weight: 700; }
      #bar.priv #private-badge { display: inline; }
      #review-mode { display: none; color: #ff8a80; }
      body.review-private #review-mode { display: inline; }

      /* --- pen annotation + laser ---------------------------------------- */
      /* Both canvases sit over the whole stage, under #bar (which follows them
         in the DOM, so the bar wins both paint and hit-testing). Neither
         intercepts input — pen strokes are picked up on #stage itself, so the
         slide underneath stays fully interactive — except when ✎ Draw arms the
         ink canvas so a mouse can draw; only then does it cover the slide.
         width/height are not redundant with inset: a canvas is a replaced
         element, so inset:0 alone leaves width:auto resolving to the intrinsic
         backing-store size (stage x dpr) and every stroke lands off-stage. */
      #ink, #laser {
        position: absolute; inset: 0; width: 100%; height: 100%;
        pointer-events: none;
      }
      #ink.armed { pointer-events: auto; touch-action: none; cursor: crosshair; }
      #ink.armed.erasing { cursor: cell; }
      #stage.laser-on { cursor: none; }
      #stage.laser-on #bar { cursor: auto; }
      /* Undo/Clear need existing ink (bar.inking); the pen tools — swatches and
         the eraser — show once drawing is plausible: a stylus has been seen,
         mouse drawing is armed, or the slide already has ink (bar.inkable). */
      #bar .ink-pen, #bar .ink-tool { display: none; }
      #bar.inkable .ink-pen { display: inline-block; }
      #bar.inking .ink-tool { display: inline-block; }
      #bar #swatches { white-space: nowrap; }
      #bar .swatch {
        width: 15px; height: 15px; padding: 0; margin: 0 1px; border-radius: 50%;
        border: 1px solid #6a6a66; vertical-align: middle; cursor: pointer;
      }
      #bar .swatch.active { box-shadow: 0 0 0 2px #0d0d0d, 0 0 0 3px #d9d9d9; }
      #bar button.active { background: #e7e5df; color: #1a1a19; border-color: #cbc9c0; }
      #bar button.asking { background: #c0392b; color: #fff; border-color: #c0392b; }
      #note { color: #86847c; }
      #note.warn { color: #ffab91; }

      /* --- presenting (full screen) --------------------------------------- */
      /* Full screen, the bar is a dock: hidden until the pointer comes down to
         the bottom edge of the stage, so the wall shows only the slide. Opacity,
         not display or transform, so the bar keeps its box: deck_fit.mjs takes
         a glue slide's floor from the bar's top. The cursor hides after the
         mouse has been still for a moment and returns as soon as it moves. */
      body.presenting #bar { opacity: 0; pointer-events: none; transition: opacity .25s; }
      body.presenting.bar-shown #bar { opacity: 1; pointer-events: auto; }
      body.presenting.cursor-idle, body.presenting.cursor-idle * { cursor: none !important; }
      #fs-btn { display: none; }
      #fs-btn.available { display: inline-block; }
      /* ⤓ PDF is a link (it downloads a file), dressed as the bar's buttons. */
      #bar a.bar-btn { color: #ccc; text-decoration: none; border: 1px solid #3a3a38; border-radius: 4px; padding: 3px 9px; cursor: pointer; }
      #bar a.bar-btn:hover { background: #232322; }
      #pdf-btn, #pdf-notes-btn { display: none; }
      #pdf-btn.available, #pdf-notes-btn.available { display: inline-block; }

      /* --- contents (class.html with no ?deck) ---------------------------- */
      /* A menu, not a slide: it escapes the 16:9 stage and scrolls like an
         ordinary page, because a list of thirteen decks letterboxed into a
         projector box would be unreadable and unscrollable. */
      body.contents { overflow: auto; background: #f4f3ef; }
      body.contents #stage-wrap, body.contents #bar { display: none; }
      #contents { display: none; max-width: 54em; margin: 0 auto; padding: 4vh 5vw 8vh; }
      body.contents #contents { display: block; }
      #contents h1 {
        margin: 0 0 .15em 0; font-size: 1.9rem; font-weight: 700; color: #1a1a19;
        letter-spacing: -.01em;
      }
      #contents .lede { margin: 0 0 2em 0; color: #6b6a67; font-size: .95rem; line-height: 1.5; }
      #contents ol { list-style: none; margin: 0; padding: 0; }
      #contents li { margin-bottom: .5em; }
      /* The whole row is the link — a bigger target than the title alone, which
         matters when this is opened one-handed at the podium. */
      #contents a.deck {
        display: flex; align-items: baseline; gap: .9em;
        padding: .8em 1.1em; border: 1px solid #e0ded7; border-radius: 8px;
        background: #fff; text-decoration: none; color: inherit;
        transition: border-color .12s, box-shadow .12s;
      }
      #contents a.deck:hover { border-color: #2a78d6; box-shadow: 0 1px 6px rgba(42,120,214,.14); }
      #contents .day {
        flex: none; min-width: 5.2em; font-weight: 700; color: #256abf;
        font-size: .95rem; text-transform: uppercase; letter-spacing: .03em;
      }
      #contents .name { flex: 1; font-size: 1.05rem; line-height: 1.35; color: #1a1a19; }
      #contents .count { flex: none; color: #86847c; font-size: .82rem; white-space: nowrap; }
      #contents .badge {
        flex: none; font-size: .68rem; font-weight: 700; letter-spacing: .06em;
        text-transform: uppercase; padding: .2em .5em; border-radius: 4px;
        background: #efe6d3; color: #7a6220;
      }
      /* A video deck is watched at home, so it reads as a sub-entry of its day
         rather than as another lecture. */
      #contents li.video { margin-left: 2.2em; }
      #contents li.video a.deck { background: #faf9f6; }
      #contents a.swap {
        margin-left: .5em; color: #2a78d6; text-decoration: none;
        border-bottom: 1px solid rgba(42,120,214,.35);
      }
      #contents a.swap:hover { border-bottom-color: #2a78d6; }
      #contents .foot { margin-top: 2.5em; font-size: .82rem; color: #86847c; line-height: 1.6; }

      /* --- presenter notes (?notes) --------------------------------------- */
      /* A <slide>'s <note> is instructor-only and never projected, so it is
         hidden unless the URL asks for it — and never in the student view.
         This is the surface the authoring guide calls the "?notes view"; it is
         also what makes a note clickable, and so editable, at all. */
      #ref .deck-slide-note, #glue .presenter-note { display: none; }
      body.notes-on #ref .deck-slide-note, body.notes-on #glue .presenter-note {
        display: block; flex: none;
        margin: .8em 0 0 0; padding: .5em .9em;
        border-left: 3px solid #d9a441; background: #fdf8ee;
        font-size: 2vmin; font-size: 2.1cqmin; line-height: 1.45; color: #6b5a33;
      }
      body.notes-on #ref .deck-slide-note p, body.notes-on #glue .presenter-note p { margin: 0; font-size: inherit; }

      /* --- authoring affordance (localhost + edit-server only) ------------- */
      /* Everything below is inert unless the edit-server answers: the script at
         the end of this file wires up nothing otherwise, so a student, the
         deployed deck on gh-pages, and a plain preview all see none of it.

         Holding Alt outlines what a click would reach, in two colours that
         encode where the write would LAND:
           green solid  — slide-owned text; editing writes the slide only
           amber dashed — real book content behind a direct ref; Alt-click
                          opens its source, but editing it here is refused,
                          because it would change the reading too. */
      .deck-edit-armed [data-edit-origin="slide"] > *,
      .deck-edit-armed [data-edit-origin="caption"],
      .deck-edit-armed #glue.on,
      .deck-edit-armed #ref.on .deck-title {
        outline: 2px solid rgba(43, 138, 62, .55); outline-offset: 3px; cursor: pointer;
      }
      .deck-edit-armed [data-edit-origin="book"],
      .deck-edit-armed [data-edit-origin="book-direct"] {
        outline: 2px dashed rgba(217, 164, 65, .8); outline-offset: 3px; cursor: alias;
      }
      /* A nested book ref must not also wear the green of the slide body it
         sits inside (a table/activity ref is appended into .ref-body). */
      .deck-edit-armed [data-edit-origin="slide"] > [data-edit-origin] { outline-color: rgba(217, 164, 65, .8); }
      .deck-edit-active {
        outline: 2px solid #2b8a3e !important; outline-offset: 3px;
        background: #f2fbf4; border-radius: 3px;
      }
      .deck-edit-toast {
        position: fixed; left: 50%; bottom: 52px; transform: translateX(-50%);
        z-index: 30; max-width: 60ch; padding: .55em 1em; border-radius: 6px;
        font-size: 13px; line-height: 1.45; color: #fff; box-shadow: 0 4px 14px rgba(0,0,0,.3);
      }
      .deck-edit-toast-ok { background: #2b8a3e; }
      .deck-edit-toast-error { background: #c92a2a; }
      .deck-edit-toast-info { background: #343a40; }

      /* Per-slide form editor (alt-shift-click a glue slide, or a ref slide's
         title bar). Covers the stage while open. */
      #slideedit {
        position: absolute; inset: 0; z-index: 20; display: none;
        background: #fff; padding: 4% 6%; overflow: auto;
      }
      #slideedit.on { display: block; }
      #slideedit h2 { margin: 0 0 .1em 0; font-size: 3.2cqmin; font-weight: 600; color: #256abf; }
      #slideedit .sub { margin: 0 0 1em 0; font-size: 2cqmin; color: #52514e; }
      #slideedit .se-field { margin-bottom: 1.1cqmin; }
      #slideedit label {
        display: block; font-size: 1.9cqmin; font-weight: 600; color: #52514e;
        margin-bottom: .25em; text-transform: uppercase; letter-spacing: .04em;
      }
      #slideedit input, #slideedit textarea {
        width: 100%; font: inherit; font-size: 2.1cqmin; line-height: 1.5;
        padding: .45em .6em; border: 1px solid #cbc9c0; border-radius: 5px;
        background: #fdfdfc; color: #1a1a19; resize: vertical;
      }
      /* Tall enough that a five-bullet agenda — the common case — is visible
         without scrolling the field. */
      #slideedit textarea { min-height: 15cqmin; }
      #slideedit input:focus, #slideedit textarea:focus { outline: 2px solid #256abf; outline-offset: -1px; border-color: #256abf; }
      #slideedit .ed-foot { display: flex; align-items: center; gap: .8em; margin-top: 1.4cqmin; }
      #ref mjx-container[display="true"] { margin: .35em 0; }
      #slideedit button {
        font: inherit; font-size: 2cqmin; padding: .4em 1.1em; cursor: pointer;
        border: 1px solid #cbc9c0; border-radius: 5px; background: #f2f1ed; color: #1a1a19;
      }
      #slideedit #se-save { background: #256abf; border-color: #256abf; color: #fff; font-weight: 600; }
      #slideedit button:hover { filter: brightness(.97); }
      #slideedit #se-status { font-size: 1.9cqmin; }
      #slideedit #se-status.ok { color: #2b8a3e; }
      #slideedit #se-status.err { color: #c92a2a; }
    </style>
    <!-- Extra per-course scripts, loaded synchronously and in order before the
         player runs: COURSE.scripts = ['classroom.js'] (assets/course.js). ENGS 20
         uses it for "follow me", whose session client reads the slide number
         from location.hash and so needs no other hook in the player. -->
    <script>
      ;(window.COURSE.scripts || []).forEach(function (src) {
        document.write('<script src="' + src.replace(/"/g, '') + '"><\/script>')
      })
    </script>
    <!-- MathJax, the same build the book pages load, so <m> and <md> on a slide
         are typeset instead of flattened. demath() below is the fallback when the
         CDN is unreachable (the flags are read by typesetMath). -->
    <script>
      window.__mjState = 'loading'
      window.MathJax = {
        tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']] },
        options: { processHtmlClass: 'process-math', ignoreHtmlClass: 'tex2jax_ignore' },
        startup: { typeset: false }
      }
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js"
            onload="window.__mjState = 'ok'" onerror="window.__mjState = 'failed'"></script>
  </head>
  <body>
    <!-- Table of contents, shown when class.html is opened with no ?deck. -->
    <div id="contents"></div>
    <div id="stage-wrap">
      <div id="stage">
        <div id="glue" class="slide"></div>
        <div id="ref" class="slide">
          <h2 class="deck-title" id="ref-title"></h2>
          <div class="ref-cols">
            <div class="ref-body" id="ref-body"></div>
            <div class="ref-media" id="ref-media"></div>
          </div>
        </div>
        <div id="err" class="slide"></div>
        <!-- Authoring only. Inert markup on the deployed deck: nothing reveals
             it unless the edit-server answers (see the script at the end). -->
        <div id="slideedit">
          <h2>Edit slide — <span id="se-type"></span></h2>
          <p class="sub">Writes the deck's JSON entry. ⌘⏎ saves, Esc cancels.</p>
          <div id="se-fields"></div>
          <div class="ed-foot">
            <button id="se-save" type="button">Save</button>
            <button id="se-cancel" type="button">Cancel</button>
            <span id="se-status"></span>
          </div>
        </div>
        <canvas id="ink"></canvas>
        <canvas id="laser"></canvas>
        <div id="bar">
          <span id="title"></span>
          <span id="instr-badge">✎ instructor only — hidden from students</span>
          <span id="private-badge">🔒 PRIVATE — never project this</span>
          <span id="review-mode">🔒 review mode: private slides shown (P to hide)</span>
          <span class="spacer"></span>
          <span id="note"></span>
          <span id="swatches" class="ink-pen">
            <button type="button" class="swatch" data-color="#d92b2b" style="background:#d92b2b" title="Red"></button>
            <button type="button" class="swatch" data-color="#1a1a19" style="background:#1a1a19" title="Black"></button>
            <button type="button" class="swatch" data-color="#2158a8" style="background:#2158a8" title="Blue"></button>
            <button type="button" class="swatch" data-color="#1a7f37" style="background:#1a7f37" title="Green"></button>
          </span>
          <button id="erase" class="ink-pen" type="button" title="Eraser — drag over a mark to remove it (E)">Erase</button>
          <button id="undo" class="ink-tool" type="button" title="Undo last stroke">Undo</button>
          <button id="clear" class="ink-tool" type="button" title="Erase this slide's ink">Clear</button>
          <button id="draw" type="button" title="Draw with the mouse — a stylus always draws (D)">✎ Draw</button>
          <button id="laser-btn" type="button" title="Laser pointer (L)"><span style="color:#e5484d">●</span> Laser</button>
          <a id="pdf-btn" class="bar-btn">⤓ PDF</a>
          <a id="pdf-notes-btn" class="bar-btn" role="button" title="Download the PDF with your pen marks on its pages">⤓ PDF + notes</a>
          <button id="fs-btn" type="button" title="Full screen (F)">Full screen</button>
          <span id="pos"></span>
          <button id="prev" type="button">&larr;</button>
          <button id="next" type="button">&rarr;</button>
        </div>
      </div>
    </div>

    <script>
      (function () {
        'use strict'
        var params = new URLSearchParams(location.search)
        var deckId = params.get('deck')
        // ?student → the student version of the deck: instructor-only slides
        // (solutions, reveals) are dropped. The plain URL is the in-class /
        // instructor version and shows everything.
        var studentView = params.has('student') || params.get('audience') === 'student'
        /* Set from the deck JSON, not the URL: filter_student_decks.py stamps
           `studentBuild` into a build whose instructor slides were removed at
           BUILD time. There is then no second audience to offer, so the player
           stops advertising one — no "Instructor view" lede, no switch link,
           no "(student)" in the title. This is what makes the published deck
           fit for a public site; on a localhost instructor build the flag is
           absent and everything behaves as before. */
        var studentBuild = false
        // ?notes shows each slide's instructor-only <note> / presenterNote.
        // Never in the student view, and never on the projector unless asked
        // for — but it is also what makes a note clickable, and so editable.
        var notesOn = params.has('notes') && !studentView
        if (notesOn) document.body.classList.add('notes-on')

        var glueEl = document.getElementById('glue')
        var refEl = document.getElementById('ref')
        var refTitle = document.getElementById('ref-title')
        var refBody = document.getElementById('ref-body')
        var refMedia = document.getElementById('ref-media')
        var errEl = document.getElementById('err')
        var titleEl = document.getElementById('title')
        var posEl = document.getElementById('pos')

        var deck = null

        function fail(msg) { errEl.textContent = msg; showOnly(errEl) }
        function showOnly(el) {
          ;[glueEl, refEl, errEl].forEach(function (s) { s.classList.toggle('on', s === el) })
        }
        // Deck text is authored by us, so small markup (<code>, &rarr;) is HTML.
        function html(s) { return String(s == null ? '' : s) }
        function esc(s) {
          return String(s).replace(/[&<>"]/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]
          })
        }

        function currentIndex() {
          var n = parseInt(location.hash.replace('#', ''), 10)
          if (isNaN(n) || n < 1) n = 1
          if (deck && n > deck.slides.length) n = deck.slides.length
          return n
        }
        function go(n) {
          var max = deck ? deck.slides.length : 1
          n = Math.max(1, Math.min(max, n))
          if (n === currentIndex() && location.hash) { render(); return }
          location.hash = String(n)
        }

        /* --- a self-contained C highlighter, reused from the ENGS 20 handout so
           extracted code listings match the coding window. Left-to-right scan so
           a keyword inside a string/comment is not miscoloured; output escaped. */
