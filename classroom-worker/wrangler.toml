# The realtime backend for in-class "follow me" sessions (see
# assets/classroom.js for the client side, and AUTHORING_GUIDE.md).
# Deployed as its own Worker, separate from the Pages site:
#   cd classroom-worker && npx wrangler deploy
# One Durable Object instance exists per session code; it holds the
# instructor's current page and the set of connected browsers, and
# relays page turns. new_sqlite_classes (not new_classes) so this works
# on the Workers free plan, which only supports SQLite-backed DOs.

name = "engs20-classroom"
main = "src/index.js"
compatibility_date = "2026-07-01"

# ENGS 20 reaches this through a Pages Function on its own origin (functions/session/[code].js,
# via a cross-script binding, see the repo-root wrangler.toml): same-origin WebSockets. ENGS 28
# stays on GitHub Pages, which has no functions, so its pages connect to this Worker's own
# workers.dev address directly (COURSE.sessionOrigin in its assets/course.js). The Worker only
# accepts WebSockets whose Origin is one of the course sites (ORIGIN_OK in src/index.js), and
# everything private needs the instructor key, so the open address gives nobody anything.
workers_dev = true
preview_urls = false

[[durable_objects.bindings]]
name = "SESSIONS"
class_name = "ClassSession"

# DeckBoard holds the per-deck announcement slides (see src/index.js). Also
# SQLite-backed, for the same free-plan reason as ClassSession.
[[durable_objects.bindings]]
name = "BOARDS"
class_name = "DeckBoard"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ClassSession"]

# A NEW tag, never editing v1: migrations are append-only, and adding the
# announcements DO class must not rewrite the session DO's history.
[[migrations]]
tag = "v2"
new_sqlite_classes = ["DeckBoard"]
